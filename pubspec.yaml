name: sms_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8


  # Opens the device's native SMS app pre-filled with the number + command
  # text; the user taps Send themselves. This needs NO SMS permission,
  # since the OS's own SMS app sends the message, not ours — so it's
  # compliant with Google Play's restricted SMS/Call Log permissions
  # policy (which otherwise requires the app to be the default SMS
  # handler, not viable for a device-config utility). This replaces the
  # earlier direct-send-via-telephony approach.
  url_launcher: ^6.3.0

  # Local storage for device profile (number, admin password, saved commands)
  shared_preferences: ^2.2.3
  path_provider: ^2.1.6
  flutter_pdfview: ^1.4.5
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"  # Ensure the correct path here
  remove_alpha_ios: true  # Optional: removes alpha for iOS App Store
  web: false  # Disable web icon generation
  windows: false  # Disable Windows icon generation
  macos: false  # Disable macOS icon generation

flutter:
  assets:
    - assets/icon/  # Include the icon folder to be accessible in
    - assets/manual.pdf
  uses-material-design: true